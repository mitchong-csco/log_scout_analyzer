name: Integration Tests - Full Workspace

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-test:
    name: Test Full Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-workspace-${{ hashFiles('**/Cargo.lock') }}

      - name: Build entire workspace
        run: cargo build --workspace --verbose

      - name: Test entire workspace
        run: cargo test --workspace --verbose

      - name: Check workspace
        run: cargo check --workspace

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Run integration tests
        run: cargo test --workspace --test '*'

  build-lsp-server:
    name: Build LSP Server
    runs-on: ubuntu-latest
    needs: [workspace-test]

    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build LSP Server Release
        run: cargo build --release --bin log-scout-lsp-server
        working-directory: crates/lsp-server

  report:
    name: Integration Summary
    needs: [workspace-test, integration, build-lsp-server]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 📊 Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Workspace Tests | ${{ needs.workspace-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| LSP Server Build | ${{ needs.build-lsp-server.result }} |" >> $GITHUB_STEP_SUMMARY
