name: Pattern Quality CI

# When to run this workflow
on:
  push:
    branches: [main, master, develop, 'feature/**']  # Now includes feature branches!
    paths:
      - "lsp-server/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch: # Manual trigger button

# Cancel old runs if new push happens
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Quick checks (fast feedback)
  quick-checks:
    name: Quick Checks (Format & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy
          override: true

      - name: Check code formatting
        run: |
          cd lsp-server
          cargo fmt --check
        continue-on-error: true

      - name: Run Clippy linter
        run: |
          cd lsp-server
          cargo clippy --lib -- -D warnings
        continue-on-error: true

  # Job 2: Build and test (runs after quick checks)
  test-lsp-server:
    name: Test LSP Server
    needs: quick-checks
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Rust ${{ matrix.rust }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          profile: minimal
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            lsp-server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build LSP Server
        run: |
          cd lsp-server
          cargo build --lib --verbose

      - name: Run all tests
        run: |
          cd lsp-server
          cargo test --lib --verbose

      - name: Test Pattern Marking System
        run: |
          cd lsp-server
          cargo test pattern_loader::tests --lib -- --nocapture

      - name: Test Pattern Testing System
        run: |
          cd lsp-server
          cargo test pattern_tester::tests --lib -- --nocapture

      - name: Test Runtime Monitoring
        run: |
          cd lsp-server
          cargo test quality_monitor::tests --lib -- --nocapture

      - name: Test Quality Evaluation
        run: |
          cd lsp-server
          cargo test pattern_quality_evaluator::tests --lib -- --nocapture

      - name: Run pattern quality example
        run: |
          cd lsp-server
          cargo run --example evaluate-patterns
        continue-on-error: true

  # Job 3: Test VSCode extension
  test-vscode-extension:
    name: Test VSCode Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: |
          cd vscode-extension
          npm ci

      - name: Compile extension
        run: |
          cd vscode-extension
          npm run compile

      - name: Run linting
        run: |
          cd vscode-extension
          npm run lint
        continue-on-error: true

  # Job 4: Summary report
  report:
    name: Test Summary
    needs: [quick-checks, test-lsp-server, test-vscode-extension]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 📊 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Checks | ${{ needs.quick-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| LSP Server Tests | ${{ needs.test-lsp-server.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VSCode Extension | ${{ needs.test-vscode-extension.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
