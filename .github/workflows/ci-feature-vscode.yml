name: Feature - VSCode Extension

on:
  push:
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/ci-feature-vscode.yml'
  pull_request:
    paths:
      - 'vscode-extension/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-vscode:
    name: VSCode Extension - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: |
          cd vscode-extension
          npm ci

      - name: Compile extension
        run: |
          cd vscode-extension
          npm run compile

      - name: Run linting
        run: |
          cd vscode-extension
          npm run lint
        continue-on-error: true

      - name: Check types
        run: |
          cd vscode-extension
          npx tsc --noEmit

  report:
    name: VSCode Summary
    needs: [test-vscode]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 📊 VSCode Extension Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.test-vscode.result }} |" >> $GITHUB_STEP_SUMMARY
