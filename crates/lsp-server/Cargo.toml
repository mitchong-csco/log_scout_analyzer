[package]
name = "lsp-server"
version = "0.1.0"
edition = "2021"
authors = ["Log Scout Team"]
description = "LSP Server orchestrator - integrates all features"
license = "MIT"

[[bin]]
name = "log-scout-lsp-server"
path = "src/main.rs"

[dependencies]
log-scout-core = { path = "../core" }
pattern-engine = { path = "../pattern-engine" }
pattern-loader = { path = "../pattern-loader" }
quality-system = { path = "../quality-system" }

tower-lsp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
