#ACS/IOS cause code mapping
1 = Unallocated (unassigned) number
2 = No route to specified transit network (national use)
3 = Destination address resolution failure
4 = Send special information tone
5 = Misdialed trunk prefix (national use)
6 = Channel Unacceptable
7 = Call awarded and being delivered in an established channel
8 = Preemption
9 = Preemption. Circuit reserved for reuse
10 = Normal call clearing
11 = User busy
12 = No user responding
13 = No answer from the user (user alerted)
14 = Subscriber absent
15 = Call rejected
16 = Number changed
17 = Redirection to a new destination
19 = Exchange routing error
1A = Nonselected user clearing
1B = Socket failure
1C = Invalid number format
1D = Facility rejected
1E = Response to STATUS ENQUIRY
1F = Normal, unspecified
22 = No circuit/channel available
26 = Network out of order
27 = Permanent frame mode connection is out of service
28 = Permanent frame mode connection is operational
29 = Temporary failure
2A = Switching equipment congestion
2B = Access information discarded
2C = Requested circuit/channel not available
2E = Precedence call blocked
2F = Internal resource allocation failure
31 = QoS error
32 = Requested facility not subscribed
35 = Outgoing calls barred within Closed User Group (CUG)
37 = Incoming calls barred within Closed User Group (CUG)
39 = Bearer capability not authorized
3A = Bearer capability not presently available
3E = Inconsistency in designated outgoing access information and subscriber class
3F = Service or option not available, unspecified
41 = Media negotiation failure
42 = Channel type not implemented
45 = Requested facility not implemented
46 = Only restricted digital information bearer capability is available (National use)
4F = Service or option not implemented, unspecified
51 = Invalid call reference value
52 = Identified channel does not exist
53 = A suspended call exists, but this call identity does not
54 = Call identitiy in use
55 = No call suspended
56 = Call having the requested call identity has been cleared
57 = User is not a member of Closed User Group (CUG)
58 = Incompatible destination
5A = Nonexistent Closed User Group (CUG)
5B = Invalid transit network selection (National use)
5F = Invalid message received error
60 = Mandatory IE missing error
61 = Message type nonexistent or not implemented
62 = Message not compatible with call state or message type nonexistent or not implemented
63 = An information element or parameter does not exist or is not implemented
64 = Invalid IE contents error
65 = Message in invalid call state
66 = Call setup timeout failure
67 = Parameter nonexistent or not implemented - passed on (National use)
6E = Message with unrecognized parameter discarded
