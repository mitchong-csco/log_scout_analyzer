#UCM Cause Code to String definition
0 = No error 
1 = Unallocated (unassigned) number. Explanation: The number requested by the calling user cannot be reached because it is not currently assigned to any user by the network. 
2 = No route to specified transit network (national use). Explanation: The equipment issuing this cause received a request to route the call through a transit network that it does not recognize. The equipment issuing this cause does not recognize the transit network because the network does not exist, or the network exists but does not serve the equipment that is sending this cause. This message is network dependent. 
3 = No route to destination. Explanation: The called user cannot be reached because the network that serves the called user is inaccessible. 
4 = Send special information tone 
5 = Mis-dialed trunk prefix (national use) 
6 = Channel unacceptable 
7 = Call awarded and being delivered in an established channel 
8 = Preemption 
9 = Preemption - circuit reserved for reuse 
16 = Normal call clearing. Explanation: The call is being cleared because one of the users involved in the call has requested that the call be cleared. 
17 = User busy 
18 = No user responding 
19 = No answer from user (user alerted) 
20 = Subscriber absent 
21 = Call rejected 
22 = Number changed 
26 = Non-selected user clearing 
27 = Destination out of order 
28 = Invalid number format (address incomplete) 
29 = Facility rejected 
30 = Response to STATUS ENQUIRY 
31 = Normal, unspecified 
34 = No circuit/channel available 
38 = Network out of order 
39 = Permanent frame mode connection out of service 
40 = Permanent frame mode connection operational 
41 = Temporary failure 
42 = Switching equipment congestion 
43 = Access information discarded 
44 = Requested circuit/channel not available 
46 = Precedence call blocked 
47 = Resource unavailable, unspecified. Explanation: A resource unavailable event occurred and no other cause in the resource unavailable class applies. 
49 = Quality of Service not available 
50 = Requested facility not subscribed 
53 = Service operation violated 
54 = Incoming calls barred 
55 = Incoming calls barred within CUG (Closed User Group) 
57 = Bearer capability not authorized 
58 = Bearer capability not presently available. This cause code will be used by MeetMe conference to disconnect a call that does not meet the  inimum security level for that MeetMe conference. Explanation: The requested bearer service is implemented by the equipment, but it is not available at this time. 
62 = Inconsistency in designated outgoing access information and subscriber class 
63 = Service or option not available, unspecified 
65 = Bearer capability not implemented. Explanation: The equipment issuing this cause does not support the requested bearer capability. 
66 = Channel type not implemented 
69 = Requested facility not implemented 
70 = Only restricted digital information bearer capability is available (national use) 
79 = Service or option not implemented, unspecified 
81 = Invalid call reference value 
82 = Identified channel does not exist 
