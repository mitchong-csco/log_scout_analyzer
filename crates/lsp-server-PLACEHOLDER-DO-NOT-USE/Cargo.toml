[package]
name = "lsp-server-modular"
version = "0.1.0"
edition = "2021"
authors = ["Log Scout Team"]
description = "LSP Server orchestrator - integrates all features (EXPERIMENTAL - DO NOT USE IN PRODUCTION)"
license = "MIT"

[[bin]]
name = "log-scout-lsp-server-MODULAR-EXPERIMENTAL"
