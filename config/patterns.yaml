# Log Scout Analyzer - Pattern Configuration
#
# This file defines the patterns that the Log Scout Analyzer will detect
# in log files. Patterns are organized by category and can be customized
# for different services (Jabber, Webex, system logs, etc.)

# Pattern Schema:
# - id: Unique identifier (required)
# - name: Human-readable name (required)
# - description: Detailed explanation (required)
# - pattern: Regular expression (required)
# - mode: Pattern matching mode (optional, default: singleline)
#   - singleline: Match within a single line
#   - multiline: Match across multiple lines with context
#   - sequence: Match a sequence of patterns
# - severity: error | warning | info | hint (required)
# - category: Grouping category (optional)
# - service: Service name (optional: jabber, webex, system)
# - tags: Additional classification tags (optional)
# - action: Suggested remediation (optional)
# - enabled: Whether pattern is active (optional, default: true)

version: "1.0"

patterns:
  # ============================================================================
  # ERROR PATTERNS - Critical issues requiring immediate attention
  # ============================================================================

  - id: "error-exception"
    name: "Exception Detected"
    description: "Detects exception traces in logs"
    pattern: '(?i)(exception|error):\s*(.+?)(?:\n|$)'
    severity: error
    category: "errors"
    tags: ["exception", "critical"]
    action: "Review stack trace and identify root cause"
    enabled: true

  - id: "error-fatal"
    name: "Fatal Error"
    description: "Detects fatal errors that cause service termination"
    pattern: '(?i)fatal\s*(error)?:\s*(.+)'
    severity: error
    category: "errors"
    tags: ["fatal", "critical", "service-down"]
    action: "Immediate investigation required - service may be down"
    enabled: true

  - id: "error-out-of-memory"
    name: "Out of Memory Error"
    description: "Detects OOM errors"
    pattern: '(?i)(out\s*of\s*memory|oom\s*killer|java\.lang\.OutOfMemoryError)'
    severity: error
    category: "errors"
    tags: ["memory", "resource", "critical"]
    action: "Check memory allocation and increase heap size if needed"
    enabled: true

  - id: "error-connection-refused"
    name: "Connection Refused"
    description: "Detects connection refused errors"
    pattern: '(?i)connection\s*refused|ECONNREFUSED'
    severity: error
    category: "network"
    tags: ["network", "connectivity"]
    action: "Verify target service is running and firewall rules"
    enabled: true

  - id: "error-timeout"
    name: "Timeout Error"
    description: "Detects timeout errors in operations"
    pattern: '(?i)(timeout|timed\s*out|ETIMEDOUT):\s*(.+)'
    severity: error
    category: "performance"
    tags: ["timeout", "performance"]
    action: "Investigate slow operations and increase timeout if appropriate"
    enabled: true

  # ============================================================================
  # WARNING PATTERNS - Issues that may lead to problems
  # ============================================================================

  - id: "warn-deprecated"
    name: "Deprecated API Usage"
    description: "Detects usage of deprecated APIs"
    pattern: '(?i)(deprecated|deprecation\s*warning):\s*(.+)'
    severity: warning
    category: "warnings"
    tags: ["deprecated", "api"]
    action: "Update code to use current API versions"
    enabled: true

  - id: "warn-retry"
    name: "Retry Attempt"
    description: "Detects retry attempts which may indicate intermittent issues"
    pattern: '(?i)retry(?:ing)?\s*(?:attempt)?\s*(\d+)|attempt\s*(\d+)\s*of\s*(\d+)'
    severity: warning
    category: "warnings"
    tags: ["retry", "reliability"]
    action: "Monitor retry frequency and investigate if excessive"
    enabled: true

  - id: "warn-high-memory"
    name: "High Memory Usage"
    description: "Detects high memory usage warnings"
    pattern: '(?i)memory\s*usage\s*(?:at|above|exceeds?)\s*(\d+)%'
    severity: warning
    category: "performance"
    tags: ["memory", "resource"]
    action: "Monitor memory trends and consider scaling"
    enabled: true

  - id: "warn-slow-query"
    name: "Slow Query"
    description: "Detects slow database queries"
    pattern: '(?i)slow\s*query:\s*(\d+(?:\.\d+)?)\s*(ms|seconds?)'
    severity: warning
    category: "performance"
    tags: ["database", "performance"]
    action: "Optimize query or add appropriate indexes"
    enabled: true

  # ============================================================================
  # AUTHENTICATION & SECURITY PATTERNS
  # ============================================================================

  - id: "auth-failed-login"
    name: "Failed Login Attempt"
    description: "Detects failed authentication attempts"
    pattern: '(?i)(authentication|login|auth)\s*(failed|failure|denied|rejected).*?(?:user[:\s]+([^\s]+))?'
    severity: warning
    category: "authentication"
    service: "jabber"
    tags: ["security", "authentication"]
    action: "Monitor for brute force attacks"
    enabled: true

  - id: "auth-account-locked"
    name: "Account Locked"
    description: "Detects account lockouts"
    pattern: '(?i)account\s*(locked|disabled|suspended).*?(?:user[:\s]+([^\s]+))?'
    severity: error
    category: "authentication"
    tags: ["security", "authentication"]
    action: "Verify if lockout is expected or investigate for security breach"
    enabled: true

  - id: "auth-invalid-token"
    name: "Invalid Token"
    description: "Detects invalid or expired token usage"
    pattern: '(?i)(invalid|expired|malformed)\s*token'
    severity: warning
    category: "authentication"
    tags: ["security", "authentication", "token"]
    action: "Check token generation and validation logic"
    enabled: true

  - id: "security-unauthorized-access"
    name: "Unauthorized Access Attempt"
    description: "Detects unauthorized access attempts"
    pattern: '(?i)(unauthorized|forbidden|access\s*denied|permission\s*denied)'
    severity: error
    category: "security"
    tags: ["security", "authorization"]
    action: "Review access controls and investigate potential security breach"
    enabled: true

  # ============================================================================
  # JABBER-SPECIFIC PATTERNS
  # ============================================================================

  - id: "jabber-cluster-node-down"
    name: "Jabber Cluster Node Down"
    description: "Detects when a Jabber cluster node goes down"
    pattern: '(?i)(?:cluster\s*node|jabber\s*node).*?(?:down|offline|unreachable|failed)'
    severity: error
    category: "jabber"
    service: "jabber"
    tags: ["cluster", "availability"]
    action: "Check node status and restart if necessary"
    enabled: true

  - id: "jabber-presence-storm"
    name: "Presence Storm Detected"
    description: "Detects presence storms in Jabber"
    pattern: '(?i)presence\s*storm|excessive\s*presence\s*updates'
    severity: warning
    category: "jabber"
    service: "jabber"
    tags: ["presence", "performance"]
    action: "Throttle presence updates and investigate root cause"
    enabled: true

  - id: "jabber-database-connection-pool"
    name: "Database Connection Pool Exhausted"
    description: "Detects database connection pool exhaustion"
    pattern: '(?i)(?:database|db)\s*connection\s*pool\s*(?:exhausted|full|empty)'
    severity: error
    category: "jabber"
    service: "jabber"
    tags: ["database", "resource"]
    action: "Increase connection pool size or investigate connection leaks"
    enabled: true

  - id: "jabber-xmpp-stream-error"
    name: "XMPP Stream Error"
    description: "Detects XMPP stream errors"
    pattern: '(?i)xmpp.*?stream.*?error|stream.*?error.*?xmpp'
    severity: error
    category: "jabber"
    service: "jabber"
    tags: ["xmpp", "protocol"]
    action: "Review XMPP logs and check client compatibility"
    enabled: true

  # ============================================================================
  # WEBEX-SPECIFIC PATTERNS
  # ============================================================================

  - id: "webex-meeting-creation-failed"
    name: "Webex Meeting Creation Failed"
    description: "Detects failed Webex meeting creation attempts"
    pattern: '(?i)(?:meeting|conference)\s*creation\s*(?:failed|error)'
    severity: error
    category: "webex"
    service: "webex"
    tags: ["meeting", "creation"]
    action: "Check Webex API connectivity and credentials"
    enabled: true

  - id: "webex-media-server-unavailable"
    name: "Media Server Unavailable"
    description: "Detects media server availability issues"
    pattern: '(?i)media\s*server.*?(?:unavailable|unreachable|down|offline)'
    severity: error
    category: "webex"
    service: "webex"
    tags: ["media", "availability"]
    action: "Verify media server status and network connectivity"
    enabled: true

  - id: "webex-participant-connection-failed"
    name: "Participant Connection Failed"
    description: "Detects when participants fail to connect"
    pattern: '(?i)participant.*?(?:connection\s*failed|failed\s*to\s*connect|connection\s*error)'
    severity: warning
    category: "webex"
    service: "webex"
    tags: ["participant", "connectivity"]
    action: "Check network requirements and firewall rules"
    enabled: true

  - id: "webex-recording-failed"
    name: "Recording Failed"
    description: "Detects recording failures"
    pattern: '(?i)recording\s*(?:failed|error|stopped\s*unexpectedly)'
    severity: error
    category: "webex"
    service: "webex"
    tags: ["recording", "storage"]
    action: "Verify storage availability and recording service health"
    enabled: true

  # ============================================================================
  # NETWORK PATTERNS
  # ============================================================================

  - id: "network-dns-resolution-failed"
    name: "DNS Resolution Failed"
    description: "Detects DNS resolution failures"
    pattern: '(?i)(?:dns|name)\s*resolution\s*failed|ENOTFOUND|host\s*not\s*found'
    severity: error
    category: "network"
    tags: ["dns", "network"]
    action: "Verify DNS configuration and network connectivity"
    enabled: true

  - id: "network-ssl-certificate-error"
    name: "SSL Certificate Error"
    description: "Detects SSL/TLS certificate errors"
    pattern: '(?i)(?:ssl|tls|certificate).*?(?:error|invalid|expired|untrusted)'
    severity: error
    category: "network"
    tags: ["ssl", "security", "certificate"]
    action: "Verify certificate validity and trust chain"
    enabled: true

  - id: "network-packet-loss"
    name: "Packet Loss Detected"
    description: "Detects network packet loss"
    pattern: '(?i)packet\s*loss:\s*(\d+(?:\.\d+)?)\s*%'
    severity: warning
    category: "network"
    tags: ["network", "quality"]
    action: "Investigate network path and reduce congestion"
    enabled: true

  # ============================================================================
  # PERFORMANCE PATTERNS
  # ============================================================================

  - id: "perf-high-cpu"
    name: "High CPU Usage"
    description: "Detects high CPU usage"
    pattern: '(?i)cpu\s*usage\s*(?:at|above|exceeds?)\s*(\d+)%'
    severity: warning
    category: "performance"
    tags: ["cpu", "resource"]
    action: "Identify resource-intensive processes and optimize"
    enabled: true

  - id: "perf-disk-full"
    name: "Disk Full"
    description: "Detects disk space issues"
    pattern: '(?i)(?:disk|filesystem|storage).*?(?:full|out\s*of\s*space|no\s*space)'
    severity: error
    category: "performance"
    tags: ["disk", "storage", "resource"]
    action: "Free up disk space or expand storage"
    enabled: true

  - id: "perf-thread-pool-exhausted"
    name: "Thread Pool Exhausted"
    description: "Detects thread pool exhaustion"
    pattern: '(?i)thread\s*pool\s*(?:exhausted|full|maxed\s*out)'
    severity: error
    category: "performance"
    tags: ["threads", "resource"]
    action: "Increase thread pool size or investigate thread leaks"
    enabled: true

  # ============================================================================
  # INFORMATIONAL PATTERNS
  # ============================================================================

  - id: "info-service-started"
    name: "Service Started"
    description: "Detects service startup messages"
    pattern: '(?i)(?:service|server|application).*?(?:started|starting|running)'
    severity: info
    category: "lifecycle"
    tags: ["startup", "lifecycle"]
    enabled: true

  - id: "info-service-stopped"
    name: "Service Stopped"
    description: "Detects service shutdown messages"
    pattern: '(?i)(?:service|server|application).*?(?:stopped|stopping|shutdown|shutting\s*down)'
    severity: info
    category: "lifecycle"
    tags: ["shutdown", "lifecycle"]
    enabled: true

  - id: "info-configuration-loaded"
    name: "Configuration Loaded"
    description: "Detects configuration loading messages"
    pattern: '(?i)(?:configuration|config|settings)\s*(?:loaded|initialized|applied)'
    severity: info
    category: "configuration"
    tags: ["config", "initialization"]
    enabled: true

# Multi-line pattern examples (these require context windows)
multiline_patterns:
  - id: "multiline-stack-trace"
    name: "Stack Trace"
    description: "Detects multi-line stack traces"
    pattern: '(?s)(?:Exception|Error).*?(?:at\s+[\w.$]+\(.*?\)[\r\n]+)+'
    mode:
      multiline:
        context_lines: 20
    severity: error
    category: "errors"
    tags: ["exception", "stack-trace"]
    enabled: true

  - id: "multiline-sql-error"
    name: "SQL Error with Query"
    description: "Detects SQL errors with the associated query"
    pattern: '(?s)SQL\s*(?:Error|Exception).*?Query:.*?;'
    mode:
      multiline:
        context_lines: 10
    severity: error
    category: "database"
    tags: ["sql", "database"]
    enabled: true

# Pattern signatures - combinations of patterns that indicate specific scenarios
signatures:
  - id: "sig-memory-leak-suspected"
    name: "Suspected Memory Leak"
    description: "Multiple memory warnings followed by OOM"
    patterns:
      - "warn-high-memory"
      - "error-out-of-memory"
    within_lines: 1000
    severity: error
    action: "Perform heap dump analysis and identify memory leak"

  - id: "sig-cascade-failure"
    name: "Cascade Failure"
    description: "Multiple connection failures in quick succession"
    patterns:
      - "error-connection-refused"
      - "error-timeout"
    occurrence_threshold: 5
    within_seconds: 60
    severity: error
    action: "Check for upstream service failures or network issues"

  - id: "sig-security-breach-attempt"
    name: "Potential Security Breach"
    description: "Multiple failed login attempts from same source"
    patterns:
      - "auth-failed-login"
    occurrence_threshold: 10
    within_seconds: 300
    severity: error
    action: "Block source IP and investigate for security breach"
