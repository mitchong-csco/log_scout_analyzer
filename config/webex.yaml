# Webex-specific log patterns for Log Scout Analyzer
# These patterns detect common issues, errors, and events in Webex logs

patterns:
  # Connection and Network Issues
  - id: "webex-connection-failed"
    name: "Webex Connection Failed"
    description: "Detects failed connection attempts to Webex services"
    pattern: "(?i)(connection\\s+failed|unable\\s+to\\s+connect|connection\\s+refused).*webex"
    mode: "singleline"
    severity: "error"
    category: "connectivity"
    service: "webex"
    tags: ["network", "connection"]
    action: "Check network connectivity and firewall rules for Webex domains"

  - id: "webex-timeout"
    name: "Webex Connection Timeout"
    description: "Detects connection timeout issues"
    pattern: "(?i)(timeout|timed\\s+out).*webex|webex.*(timeout|timed\\s+out)"
    mode: "singleline"
    severity: "warning"
    category: "connectivity"
    service: "webex"
    tags: ["network", "timeout"]
    action: "Verify network latency and Webex service status"

  - id: "webex-dns-resolution-failed"
    name: "DNS Resolution Failed"
    description: "DNS lookup failures for Webex domains"
    pattern: "(?i)dns\\s+(resolution\\s+)?fail.*webex|failed\\s+to\\s+resolve.*webex"
    mode: "singleline"
    severity: "error"
    category: "connectivity"
    service: "webex"
    tags: ["dns", "network"]
    action: "Check DNS server configuration and connectivity"

  # Authentication Issues
  - id: "webex-auth-failed"
    name: "Webex Authentication Failed"
    description: "Authentication failures for Webex services"
    pattern: "(?i)(auth|authentication)\\s+(failed|failure|error).*webex|webex.*(auth|authentication)\\s+(failed|failure)"
    mode: "singleline"
    severity: "error"
    category: "authentication"
    service: "webex"
    tags: ["auth", "security"]
    action: "Verify credentials and token validity"

  - id: "webex-token-expired"
    name: "Access Token Expired"
    description: "Expired access or refresh token"
    pattern: "(?i)(token|access\\s+token|refresh\\s+token)\\s+(expired|invalid|revoked)"
    mode: "singleline"
    severity: "warning"
    category: "authentication"
    service: "webex"
    tags: ["auth", "token"]
    action: "Refresh authentication token"

  - id: "webex-unauthorized"
    name: "Unauthorized Access"
    description: "401 or 403 unauthorized access attempts"
    pattern: "(?i)(401|403|unauthorized|forbidden).*webex|webex.*(401|403|unauthorized)"
    mode: "singleline"
    severity: "error"
    category: "authentication"
    service: "webex"
    tags: ["auth", "access-denied"]
    action: "Check user permissions and API credentials"

  # API and Service Errors
  - id: "webex-api-error"
    name: "Webex API Error"
    description: "General API errors from Webex services"
    pattern: "(?i)webex\\s+api\\s+(error|fail)|api\\s+(error|fail).*webex"
    mode: "singleline"
    severity: "error"
    category: "api"
    service: "webex"
    tags: ["api"]
    action: "Review API error details and check service status"

  - id: "webex-rate-limit"
    name: "API Rate Limit Exceeded"
    description: "Rate limiting from Webex API"
    pattern: "(?i)(rate\\s+limit|too\\s+many\\s+requests|429).*webex|webex.*(rate\\s+limit|429)"
    mode: "singleline"
    severity: "warning"
    category: "api"
    service: "webex"
    tags: ["api", "rate-limit"]
    action: "Implement exponential backoff and reduce request frequency"

  - id: "webex-service-unavailable"
    name: "Service Unavailable"
    description: "503 service unavailable errors"
    pattern: "(?i)(503|service\\s+unavailable).*webex|webex.*(503|service\\s+unavailable)"
    mode: "singleline"
    severity: "error"
    category: "availability"
    service: "webex"
    tags: ["service", "outage"]
    action: "Check Webex status page and retry after delay"

  # Media and Call Issues
  - id: "webex-media-failure"
    name: "Media Stream Failure"
    description: "Audio/video media stream issues"
    pattern: "(?i)(media|audio|video)\\s+(fail|error|lost|dropped).*webex"
    mode: "singleline"
    severity: "warning"
    category: "media"
    service: "webex"
    tags: ["media", "audio", "video"]
    action: "Check media ports and QoS settings"

  - id: "webex-call-dropped"
    name: "Call Dropped"
    description: "Unexpected call disconnection"
    pattern: "(?i)(call|meeting)\\s+(dropped|disconnected|terminated\\s+unexpectedly)"
    mode: "singleline"
    severity: "error"
    category: "media"
    service: "webex"
    tags: ["call", "meeting"]
    action: "Review network stability and bandwidth availability"

  - id: "webex-poor-quality"
    name: "Poor Media Quality"
    description: "Degraded audio or video quality indicators"
    pattern: "(?i)(poor|degraded|low)\\s+(quality|bandwidth|jitter|packet\\s+loss)"
    mode: "singleline"
    severity: "warning"
    category: "media"
    service: "webex"
    tags: ["quality", "performance"]
    action: "Analyze network conditions and QoS metrics"

  # Meeting and Room Issues
  - id: "webex-meeting-join-failed"
    name: "Failed to Join Meeting"
    description: "Errors when joining Webex meetings"
    pattern: "(?i)(fail|unable)\\s+to\\s+join\\s+(meeting|room)|meeting\\s+join\\s+(error|fail)"
    mode: "singleline"
    severity: "error"
    category: "meeting"
    service: "webex"
    tags: ["meeting", "room"]
    action: "Verify meeting ID and user permissions"

  - id: "webex-room-not-found"
    name: "Room Not Found"
    description: "Meeting room or space not found"
    pattern: "(?i)(room|space|meeting)\\s+(not\\s+found|does\\s+not\\s+exist|404)"
    mode: "singleline"
    severity: "error"
    category: "meeting"
    service: "webex"
    tags: ["meeting", "room"]
    action: "Check room ID and existence"

  # Configuration Issues
  - id: "webex-config-error"
    name: "Configuration Error"
    description: "Invalid or missing configuration"
    pattern: "(?i)(config|configuration)\\s+(error|invalid|missing).*webex"
    mode: "singleline"
    severity: "error"
    category: "configuration"
    service: "webex"
    tags: ["config"]
    action: "Review Webex configuration settings"

  - id: "webex-missing-parameter"
    name: "Missing Required Parameter"
    description: "Required parameter not provided"
    pattern: "(?i)(missing|required)\\s+(parameter|field|value)"
    mode: "singleline"
    severity: "error"
    category: "configuration"
    service: "webex"
    tags: ["config", "validation"]
    action: "Ensure all required parameters are provided"

  # Performance Issues
  - id: "webex-slow-response"
    name: "Slow API Response"
    description: "API response time exceeding thresholds"
    pattern: "(?i)(slow|delayed)\\s+response.*webex|response\\s+time\\s+exceeded"
    mode: "singleline"
    severity: "warning"
    category: "performance"
    service: "webex"
    tags: ["performance", "latency"]
    action: "Monitor API performance and network latency"

  # Multi-line Patterns
  - id: "webex-stack-trace"
    name: "Webex Stack Trace"
    description: "Multi-line stack trace containing Webex references"
    pattern: "(?s)(Exception|Error).*webex.*\\n(\\s+at\\s+.*\\n)+"
    mode:
      multiline:
        context_lines: 15
    severity: "error"
    category: "error"
    service: "webex"
    tags: ["exception", "stack-trace"]
    action: "Analyze full stack trace for root cause"

  - id: "webex-connection-sequence-failure"
    name: "Connection Sequence Failure"
    description: "Multi-step connection failure pattern"
    pattern: "(?s)Connecting\\s+to\\s+webex.*\\n.*fail"
    mode:
      multiline:
        context_lines: 5
    severity: "error"
    category: "connectivity"
    service: "webex"
    tags: ["connection", "sequence"]
    action: "Review full connection sequence logs"

# Baseline frequency expectations
frequency_baselines:
  - pattern_id: "webex-rate-limit"
    expected_count: 0
    window_seconds: 3600
    threshold_percent: 10
    action: "Unusual rate limiting detected"

  - pattern_id: "webex-auth-failed"
    expected_count: 2
    window_seconds: 3600
    threshold_percent: 50
    action: "Authentication failure rate exceeds baseline"

  - pattern_id: "webex-call-dropped"
    expected_count: 1
    window_seconds: 3600
    threshold_percent: 100
    action: "Call drop rate significantly elevated"

# Pattern correlation rules
correlations:
  - name: "Authentication and Connection Failure"
    description: "Auth failure followed by connection issues"
    patterns:
      - "webex-auth-failed"
      - "webex-connection-failed"
    window_seconds: 300
    severity: "error"
    action: "Potential systematic authentication or connectivity issue"

  - name: "Network Degradation Pattern"
    description: "Multiple network-related issues in sequence"
    patterns:
      - "webex-timeout"
      - "webex-poor-quality"
      - "webex-call-dropped"
    window_seconds: 600
    severity: "warning"
    action: "Network degradation detected - check infrastructure"

  - name: "Service Outage Indicators"
    description: "Multiple service unavailability signals"
    patterns:
      - "webex-service-unavailable"
      - "webex-connection-failed"
      - "webex-timeout"
    window_seconds: 300
    severity: "error"
    action: "Potential Webex service outage - check status page"
