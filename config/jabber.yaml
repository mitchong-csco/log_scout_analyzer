# Jabber Service Pattern Configuration
# Patterns specific to Cisco Unified Communications Manager (CUCM) Jabber logs

service: jabber
version: "1.0"
description: "Pattern definitions for Jabber client and server logs"

patterns:
  # Authentication Patterns
  - id: jabber-auth-failure
    name: "Jabber Authentication Failure"
    description: "Detects failed authentication attempts in Jabber logs"
    pattern: "Authentication failed for user ([\\w\\.@-]+)"
    mode: singleline
    severity: error
    category: authentication
    tags: [security, login]
    action: "Check user credentials and account status in CUCM"
    expected_frequency:
      expected_count: 0
      window_seconds: 300
      threshold_percent: 10

  - id: jabber-auth-success
    name: "Jabber Authentication Success"
    description: "Successful user authentication"
    pattern: "User ([\\w\\.@-]+) authenticated successfully"
    mode: singleline
    severity: info
    category: authentication
    tags: [security, login]

  - id: jabber-cert-error
    name: "Certificate Validation Error"
    description: "SSL/TLS certificate validation failure"
    pattern: "Certificate validation failed[:\\s]+(.*)"
    mode: singleline
    severity: error
    category: security
    tags: [ssl, tls, certificate]
    action: "Verify certificate validity and trust chain"

  # Connection Patterns
  - id: jabber-connection-lost
    name: "Connection Lost"
    description: "Lost connection to Jabber server"
    pattern: "Connection to server (.+) lost"
    mode: singleline
    severity: warning
    category: network
    tags: [connectivity, network]
    action: "Check network connectivity and server status"

  - id: jabber-connection-timeout
    name: "Connection Timeout"
    description: "Connection attempt timed out"
    pattern: "Connection timeout to ([\\w\\.:-]+)"
    mode: singleline
    severity: error
    category: network
    tags: [connectivity, timeout]
    action: "Verify network path and firewall rules"

  - id: jabber-reconnect-attempt
    name: "Reconnection Attempt"
    description: "Client attempting to reconnect"
    pattern: "Attempting to reconnect \\(attempt (\\d+)\\)"
    mode: singleline
    severity: info
    category: network
    tags: [connectivity, recovery]

  # Presence Patterns
  - id: jabber-presence-update
    name: "Presence Status Update"
    description: "User presence status changed"
    pattern: "Presence updated: user=([\\w\\.@-]+), status=(\\w+)"
    mode: singleline
    severity: info
    category: presence
    tags: [status]

  - id: jabber-presence-error
    name: "Presence Update Failed"
    description: "Failed to update presence status"
    pattern: "Failed to update presence[:\\s]+(.*)"
    mode: singleline
    severity: warning
    category: presence
    tags: [status, error]

  # Call Signaling Patterns
  - id: jabber-call-setup-failure
    name: "Call Setup Failure"
    description: "Failed to establish call"
    pattern: "Call setup failed[:\\s]+caller=([\\w@.-]+), callee=([\\w@.-]+), reason[:\\s]+(.*)"
    mode: singleline
    severity: error
    category: calling
    tags: [voice, signaling]
    action: "Check SIP trunk status and dial plan configuration"

  - id: jabber-call-dropped
    name: "Call Dropped"
    description: "Active call was dropped unexpectedly"
    pattern: "Call dropped[:\\s]+call_id=(\\S+), duration=(\\d+)s"
    mode: singleline
    severity: error
    category: calling
    tags: [voice, quality]
    action: "Investigate network quality and media path"

  - id: jabber-call-quality-poor
    name: "Poor Call Quality"
    description: "Call quality metrics below threshold"
    pattern: "Poor call quality detected[:\\s]+jitter=(\\d+)ms, packet_loss=(\\d+)%"
    mode: singleline
    severity: warning
    category: calling
    tags: [voice, quality, qos]
    action: "Check QoS settings and network congestion"

  # Media Patterns
  - id: jabber-media-negotiation-fail
    name: "Media Negotiation Failed"
    description: "Failed to negotiate media parameters"
    pattern: "Media negotiation failed[:\\s]+(.*)"
    mode: singleline
    severity: error
    category: media
    tags: [rtp, codec]
    action: "Verify codec compatibility and media port accessibility"

  - id: jabber-rtp-timeout
    name: "RTP Stream Timeout"
    description: "No RTP packets received"
    pattern: "RTP stream timeout[:\\s]+remote=(\\S+)"
    mode: singleline
    severity: error
    category: media
    tags: [rtp, timeout]
    action: "Check firewall rules for UDP media ports"

  # Voicemail Patterns
  - id: jabber-voicemail-error
    name: "Voicemail Access Error"
    description: "Error accessing voicemail system"
    pattern: "Voicemail error[:\\s]+(.*)"
    mode: singleline
    severity: error
    category: voicemail
    tags: [unity, messaging]
    action: "Verify Unity Connection integration settings"

  # Multi-line Patterns
  - id: jabber-stack-trace
    name: "Exception Stack Trace"
    description: "Detects Java or native stack traces indicating crashes"
    pattern: "(?:Exception|Error).*?\\n(?:\\s+at\\s+.*\\n)+"
    mode:
      multiline:
        context_lines: 20
    severity: error
    category: crash
    tags: [exception, debugging]
    action: "Collect full logs and contact support"

  - id: jabber-registration-sequence
    name: "Registration Sequence"
    description: "Multi-step registration process"
    pattern: "Registration started.*?Registration complete"
    mode:
      sequence:
        max_gap_lines: 50
    severity: info
    category: registration
    tags: [lifecycle]

  # Performance Patterns
  - id: jabber-high-cpu
    name: "High CPU Usage"
    description: "CPU usage exceeds threshold"
    pattern: "CPU usage: (\\d+)%"
    mode: singleline
    severity: warning
    category: performance
    tags: [resource, cpu]
    action: "Check for resource-intensive operations"
    expected_frequency:
      expected_count: 0
      window_seconds: 60
      threshold_percent: 5

  - id: jabber-memory-warning
    name: "Memory Warning"
    description: "Memory usage approaching limit"
    pattern: "Memory usage: (\\d+)MB / (\\d+)MB"
    mode: singleline
    severity: warning
    category: performance
    tags: [resource, memory]

  - id: jabber-slow-response
    name: "Slow Server Response"
    description: "Server response time exceeded threshold"
    pattern: "Slow response from server[:\\s]+endpoint=(\\S+), latency=(\\d+)ms"
    mode: singleline
    severity: warning
    category: performance
    tags: [latency, network]

  # Directory/LDAP Patterns
  - id: jabber-ldap-error
    name: "LDAP Query Error"
    description: "Failed to query LDAP directory"
    pattern: "LDAP query failed[:\\s]+(.*)"
    mode: singleline
    severity: error
    category: directory
    tags: [ldap, authentication]
    action: "Verify LDAP server connectivity and credentials"

  - id: jabber-directory-timeout
    name: "Directory Service Timeout"
    description: "Directory service request timed out"
    pattern: "Directory service timeout[:\\s]+server=(\\S+)"
    mode: singleline
    severity: error
    category: directory
    tags: [ldap, timeout]

  # Configuration Patterns
  - id: jabber-config-error
    name: "Configuration Error"
    description: "Invalid or missing configuration parameter"
    pattern: "Configuration error[:\\s]+parameter=(\\w+), error=(.*)"
    mode: singleline
    severity: error
    category: configuration
    tags: [config, setup]
    action: "Review configuration file and documentation"

  - id: jabber-config-loaded
    name: "Configuration Loaded"
    description: "Configuration successfully loaded"
    pattern: "Configuration loaded from (\\S+)"
    mode: singleline
    severity: info
    category: configuration
    tags: [config, startup]

# Pattern signatures - combinations of patterns that indicate specific scenarios
signatures:
  - id: jabber-auth-loop
    name: "Authentication Loop"
    description: "Repeated authentication failures suggesting credential or configuration issue"
    patterns:
      - jabber-auth-failure
      - jabber-auth-failure
      - jabber-auth-failure
    window_seconds: 60
    severity: error
    action: "Reset user credentials and verify CUCM user settings"

  - id: jabber-network-instability
    name: "Network Instability"
    description: "Pattern of connection issues indicating network problems"
    patterns:
      - jabber-connection-lost
      - jabber-reconnect-attempt
      - jabber-connection-timeout
    window_seconds: 300
    severity: error
    action: "Investigate network infrastructure and quality"

  - id: jabber-call-quality-degradation
    name: "Call Quality Degradation"
    description: "Multiple indicators of poor call quality"
    patterns:
      - jabber-call-quality-poor
      - jabber-rtp-timeout
      - jabber-call-dropped
    window_seconds: 600
    severity: warning
    action: "Perform network QoS analysis and check for congestion"
