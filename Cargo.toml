# Log Scout Analyzer - Workspace Configuration
#
# PRODUCTION LSP SERVER: lsp-server/ (monolithic)
#   Package name: log-scout-lsp-server
#   Binary name:  log-scout-lsp-server.exe
#   Status:       ✅ PRODUCTION - Use this one!
#   Build:        cargo build --release --manifest-path lsp-server/Cargo.toml
#
# EXPERIMENTAL LSP SERVER: crates/lsp-server-PLACEHOLDER-DO-NOT-USE/ (modular)
#   Package name: lsp-server-modular
#   Binary name:  log-scout-lsp-server-MODULAR-EXPERIMENTAL.exe
#   Status:       ❌ EXPERIMENTAL - DO NOT USE IN PRODUCTION
#   Build:        cargo build --release --manifest-path crates/lsp-server-PLACEHOLDER-DO-NOT-USE/Cargo.toml
#   Note:         Code-named binary to prevent confusion. Not added to workspace to prevent accidental builds.
#
# WARNING: The experimental server is intentionally:
#   - NOT in workspace members (prevents accidental selection)
#   - Has a long, obvious directory name
#   - Builds a differently-named binary
#   - Will exit immediately with warning if run
#
# When the modular server is ready to replace production:
#   1. Complete the implementation
#   2. Test thoroughly
#   3. Update this Cargo.toml to swap them
#   4. Archive old lsp-server/ directory
#   5. Rename modular to production binary name

[workspace]
resolver = "2"
members = [
    "lsp-server",                    # ✅ PRODUCTION SERVER - Use this!
    "crates/core",
    "crates/pattern-engine",
    "crates/pattern-loader",
    "crates/quality-system",
    "crates/tagscout-integration",
    # "crates/lsp-server-PLACEHOLDER-DO-NOT-USE",  # ❌ EXPERIMENTAL - Excluded to prevent confusion
]
exclude = [
    "archive",
]

# Shared workspace dependencies
[workspace.dependencies]
# LSP protocol
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Pattern matching
regex = "1"
lazy_static = "1.4"

# Concurrency
dashmap = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# MongoDB integration
mongodb = { version = "2.8", features = ["tokio-runtime"] }
bson = "2.9"

# Async utilities
futures = "0.3"
tokio-stream = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# URL encoding
urlencoding = "2.1"

# Archive handling
zip = "0.6"
tar = "0.4"
flate2 = "1.0"

# Directory utilities
dirs = "5.0"

# Date parsing
dateparser = "0.2"

# Dev dependencies
tokio-test = "0.4"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
