# Log Scout Analyzer - Workspace Configuration
# Feature-based monorepo architecture

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/pattern-engine",
    "crates/pattern-loader",
    "crates/quality-system",
    "crates/case-management",
    "crates/protocol-analysis",
    "crates/tagscout-integration",
    "crates/lsp-server",
]

# Shared workspace dependencies
[workspace.dependencies]
# LSP protocol
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Pattern matching
regex = "1"
lazy_static = "1.4"

# Concurrency
dashmap = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# MongoDB integration
mongodb = { version = "2.8", features = ["tokio-runtime"] }
bson = "2.9"

# Async utilities
futures = "0.3"
tokio-stream = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Directory utilities
dirs = "5.0"

# Dev dependencies
tokio-test = "0.4"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
